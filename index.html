<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Neo Casino</title>
  
  <!-- Скрипт Telegram -->
  <script src="https://cdn.jsdelivr.net/gh/amirsadeghi1/telegram-appbots-desktop@master/telegram-web-app.js"></script>
  
  <!-- Шрифты -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Стили -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Фон -->
    <div class="liquid-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

    <!-- Нижнее меню -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button class="nav-item" data-tab="games">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="nav-item" data-tab="profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </nav>

    <!-- Основной контент -->
    <main class="app-content">
      
      <header class="header">
        <div>
          <div class="greeting">Добро пожаловать</div>
          <div class="username" id="username">Игрок</div>
        </div>
        <div class="avatar">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </header>

      <!-- Карта баланса -->
      <section class="balance-card">
        <div class="card-top">
          <div class="card-label">Баланс</div>
          <div class="card-chip"></div>
        </div>
        <div class="balance-amount">
          <span id="balance-display">0</span>
          <span class="currency">TON</span>
        </div>
        <button class="topup-btn" id="topupBtn">Пополнить</button>
      </section>

      <!-- Промо -->
      <section class="promo-banner glass" id="promoBanner">
        <div class="promo-text">
          <h3>Lucky Spin</h3>
          <p>Крути и забирай x1000</p>
        </div>
        <div class="promo-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
        </div>
      </section>

      <!-- Игры -->
      <div class="section-header">
        <h2 class="section-title">Игры</h2>
        <button class="see-all" id="seeAllBtn">Все</button>
      </div>

      <div class="games-grid">
        <div class="game-card glass" data-game="Dice">
          <div class="game-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="8.5" cy="15.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/></svg>
          </div>
          <div class="game-info">
            <div class="game-name">Dice</div>
            <div class="game-desc">Угадай число</div>
          </div>
        </div>
        
        <div class="game-card glass" data-game="Roulette">
          <div class="game-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </div>
          <div class="game-info">
            <div class="game-name">Roulette</div>
            <div class="game-desc">Классика</div>
          </div>
        </div>
        
        <div class="game-card glass" data-game="Blackjack">
          <div class="game-icon">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="12" height="16" rx="2"/><path d="M6 2h12a2 2 0 0 1 2 2v14"/></svg>
          </div>
          <div class="game-info">
            <div class="game-name">Blackjack</div>
            <div class="game-desc">21 очко</div>
          </div>
        </div>
        
        <div class="game-card glass" data-game="Crash">
          <div class="game-icon">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <div class="game-info">
            <div class="game-name">Crash</div>
            <div class="game-desc">Успей забрать</div>
          </div>
        </div>
      </div>

    </main>

    <div class="toast" id="toast"></div>
  </div>

  <!-- Скрипты -->
  <script src="js/telegram.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
